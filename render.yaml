# Render Blueprint for the Phylo-BGC API (card-free free tier).
#
# In the Render dashboard: New → Blueprint → connect this GitHub repo.
# Render reads this file, builds engine/Dockerfile, and gives you
# https://<name>.onrender.com. Free web services spin down after ~15 min
# idle and cold-start in ~30-60s.
#
# After the frontend is on Vercel, lock CORS by uncommenting the env var
# below (or set it in the dashboard) and redeploying.

# NOTE: the service name below deliberately keeps the old `bgc-scape-api`
# spelling. It identifies a service that already exists; renaming it here
# does not rename that service, it provisions a second one and leaves the
# first serving the old URL.
services:
  - type: web
    name: bgc-scape-api
    runtime: docker
    plan: free
    dockerfilePath: ./engine/Dockerfile
    dockerContext: ./engine
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: BGCSCAPE_ENVIRONMENT
        value: production
      # Turns on the "All GTDB genomes" view. Render hands environment
      # variables to the Docker build as build arguments, and
      # engine/Dockerfile's WITH_GTDB_BACKBONE then downloads GTDB's metadata
      # (~300 MB, MD5-checked) and loads the backbone into the image's
      # database. It adds a few minutes to a build whose engine files
      # changed (Docker's layer cache skips it otherwise), about 125 MB to
      # the image, and ~80 MB to the running API's memory. Set it to "0" to
      # turn the view off again.
      - key: WITH_GTDB_BACKBONE
        value: "1"
      # - key: BGCSCAPE_CORS_ALLOW_ORIGINS
      #   value: https://your-project.vercel.app
