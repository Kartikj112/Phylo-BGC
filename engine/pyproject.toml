[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bgcscape"
version = "0.1.0"
description = "BGC-scape scientific engine: data model and analysis core for exploring biosynthetic gene cluster diversity across the tree of life."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "alembic>=1.13",
    "typer>=0.12",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
export = [
    # PDF rendering. Needs Cairo system libraries (libcairo2) present —
    # heavier than everything else here combined, hence its own extra and
    # a lazy import in bgcscape/export/renderer.py.
    "cairosvg>=2.7",
]

[project.scripts]
bgcscape = "bgcscape.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bgcscape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
