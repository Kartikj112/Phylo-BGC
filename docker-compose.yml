services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bgcscape
      POSTGRES_PASSWORD: bgcscape
      POSTGRES_DB: bgcscape
    ports:
      - "5432:5432"
    volumes:
      - bgcscape_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bgcscape"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  bgcscape_pgdata:
