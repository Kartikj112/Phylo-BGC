name: engine-ci

# The Postgres service-container pattern below has now been validated in
# substance, if not on an actual runner: the full test suite and the whole
# Alembic migration chain were run against a real PostgreSQL 16 instance
# during development, and both pass. What remains unvalidated is the
# GitHub Actions YAML itself (the build sandbox has no Actions access) —
# check it on the first real push.

on:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bgcscape
          POSTGRES_PASSWORD: bgcscape
          POSTGRES_DB: bgcscape_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bgcscape"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Cairo (runtime lib for the `export` extra's cairosvg)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcairo2

      - name: Install engine (with dev + api + export extras)
        working-directory: engine
        run: pip install -e ".[dev,api,export]"

      - name: Run test suite against in-memory SQLite
        working-directory: engine
        run: pytest -v

      - name: Run test suite against real Postgres
        working-directory: engine
        env:
          # NOTE the variable name: BGCSCAPE_TEST_DATABASE_URL, not
          # BGCSCAPE_DATABASE_URL. This step previously set the latter and
          # silently re-ran the SQLite suite, because tests/conftest.py
          # hardcoded SQLite and ignored it entirely — a green check mark
          # that verified nothing. Fixed and confirmed by running the full
          # suite against a real Postgres 16 instance.
          BGCSCAPE_TEST_DATABASE_URL: postgresql+psycopg://bgcscape:bgcscape@localhost:5432/bgcscape_test
        run: pytest -v

      # The test-suite step above fills bgcscape_test with tables via
      # create_all (no alembic_version row). The migration smoke test needs
      # a genuinely empty database, so reset the schema first.
      - name: Reset the Postgres schema before the migration smoke test
        env:
          PGPASSWORD: bgcscape
        run: psql -h localhost -U bgcscape -d bgcscape_test -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"

      - name: Alembic upgrade smoke test (Postgres)
        working-directory: engine
        env:
          BGCSCAPE_DATABASE_URL: postgresql+psycopg://bgcscape:bgcscape@localhost:5432/bgcscape_test
        run: alembic upgrade head
