name: engine-ci

# NOTE: this workflow is written to the standard GitHub Actions
# "service container" pattern for Postgres, but has not been executed by a
# runner as part of this chunk (the build sandbox that produced it has no
# GitHub Actions access). Treat it as a strong first draft — validate on the
# first real push before relying on it.

on:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bgcscape
          POSTGRES_PASSWORD: bgcscape
          POSTGRES_DB: bgcscape_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bgcscape"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine (with dev extras)
        working-directory: engine
        run: pip install -e ".[dev]"

      - name: Run test suite against in-memory SQLite
        working-directory: engine
        run: pytest -v

      - name: Run test suite against real Postgres
        working-directory: engine
        env:
          BGCSCAPE_DATABASE_URL: postgresql+psycopg://bgcscape:bgcscape@localhost:5432/bgcscape_test
        run: pytest -v

      - name: Alembic upgrade smoke test (Postgres)
        working-directory: engine
        env:
          BGCSCAPE_DATABASE_URL: postgresql+psycopg://bgcscape:bgcscape@localhost:5432/bgcscape_test
        run: alembic upgrade head
